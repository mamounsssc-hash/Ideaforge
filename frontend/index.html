<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IdeaForge Clipper</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◆</span> IdeaForge <span class="muted">Clipper</span>
    </div>
    <div class="pill" id="enginePill">local engine</div>
  </header>

  <main>
    <!-- STEP 1: input -->
    <section class="card" id="inputCard">
      <h1>Turn any long video into viral shorts</h1>
      <p class="sub">Free & local. Auto highlights, speaker tracking, and 40+ caption styles.</p>

      <div class="tabs">
        <button class="tab active" data-tab="file">Upload file</button>
        <button class="tab" data-tab="url">Paste URL</button>
      </div>

      <div class="tabpane" id="pane-file">
        <label class="dropzone" id="dropzone">
          <input type="file" id="fileInput" accept="video/*" hidden />
          <div class="dz-inner">
            <div class="dz-icon">⬆</div>
            <div>Drop a video here or <b>browse</b></div>
            <div class="muted small" id="fileName">MP4, MOV, MKV…</div>
          </div>
        </label>
      </div>

      <div class="tabpane hidden" id="pane-url">
        <input type="text" id="urlInput" class="text-input"
               placeholder="https://youtube.com/watch?v=…  or TikTok / X / etc." />
      </div>

      <input type="text" id="topicInput" class="text-input"
             placeholder="Optional: what should the clips be about?  e.g. “pricing tips”, “funny moments”" />

      <div class="row opts-row">
        <div class="mini">
          <label class="muted small">Spoken language</label>
          <select id="langSelect" class="text-input compact">
            <option value="en" selected>English</option>
            <option value="">Auto-detect</option>
            <option value="ar">Arabic</option>
          </select>
        </div>
        <div class="mini">
          <label class="muted small">Captions in</label>
          <select id="capLang" class="text-input compact">
            <option value="original" selected>Original</option>
            <option value="english">English (translate)</option>
          </select>
        </div>
        <div class="mini">
          <label class="muted small">Clip length</label>
          <select id="lenSelect" class="text-input compact">
            <option value="">Any</option>
            <option value="0-30">&lt; 30s</option>
            <option value="30-60" selected>30–60s</option>
            <option value="60-90">60–90s</option>
          </select>
        </div>
        <div class="mini">
          <label class="muted small">Max clips</label>
          <input type="number" id="countInput" class="text-input compact" value="10" min="1" max="30" style="width:80px" />
        </div>
      </div>
      <div class="row">
        <button class="btn primary" id="startBtn">Find clips →</button>
      </div>
    </section>

    <!-- STEP 2: progress -->
    <section class="card hidden" id="progressCard">
      <h2 id="progTitle">Working…</h2>
      <div class="progress"><div class="bar" id="progBar"></div></div>
      <div class="muted" id="progMsg">Starting…</div>
    </section>

    <!-- STEP 3: results -->
    <section class="hidden" id="resultsSection">
      <div class="results-head">
        <h2>Clips <span class="muted" id="clipCount"></span></h2>
        <div class="controls">
          <div class="style-picker">
            <label class="muted small">Caption style</label>
            <select id="styleSelect" class="text-input compact"></select>
          </div>
          <div class="style-picker">
            <label class="muted small">Aspect</label>
            <select id="aspectSelect" class="text-input compact">
              <option value="9:16" selected>9:16</option>
              <option value="4:5">4:5</option>
              <option value="1:1">1:1</option>
              <option value="16:9">16:9</option>
            </select>
          </div>
          <button class="btn ghost" id="batchBtn">Export all (ZIP)</button>
        </div>
      </div>

      <div class="toggles" id="toggles">
        <label><input type="checkbox" id="opt_reframe" checked /> Track speaker</label>
        <label><input type="checkbox" id="opt_captions" checked /> Captions</label>
        <label><input type="checkbox" id="opt_keywords" checked /> Highlight keywords</label>
        <label><input type="checkbox" id="opt_emojis" checked /> Auto emoji</label>
        <label><input type="checkbox" id="opt_hook" checked /> Hook title</label>
        <label><input type="checkbox" id="opt_bar" checked /> Progress bar</label>
        <label><input type="checkbox" id="opt_fillers" checked /> Remove um/uh</label>
        <label><input type="checkbox" id="opt_silence" /> Remove silences</label>
        <label><input type="checkbox" id="opt_zoom" /> Auto zoom</label>
        <label><input type="checkbox" id="opt_speakers" /> Speaker colors</label>
        <label><input type="checkbox" id="opt_enhance" /> Enhance audio</label>
        <label><input type="checkbox" id="opt_broll" /> B-roll (Pexels)</label>
      </div>

      <div class="toggles" id="advanced">
        <div class="adv-item">
          <label class="muted small">Layout</label>
          <select id="opt_layout" class="text-input compact">
            <option value="track" selected>Track speaker</option>
            <option value="fill">Fill (center crop)</option>
            <option value="fit">Fit (blurred pad)</option>
          </select>
        </div>
        <div class="adv-item">
          <label class="muted small">Caption position</label>
          <select id="opt_cappos" class="text-input compact">
            <option value="auto" selected>Style default</option>
            <option value="top">Top</option>
            <option value="center">Center</option>
            <option value="bottom">Bottom</option>
          </select>
        </div>
        <div class="adv-item">
          <label class="muted small">Caption size <span id="capScaleVal">100%</span></label>
          <input type="range" id="opt_capscale" min="0.6" max="1.6" step="0.05" value="1" />
        </div>
        <div class="adv-item">
          <label class="muted small">Music</label>
          <input type="file" id="musicInput" accept="audio/*" />
          <input type="range" id="opt_musicvol" min="0" max="1" step="0.05" value="0" title="music volume" />
        </div>
      </div>

      <div class="clips" id="clipList"></div>
      <div class="batch-status muted small hidden" id="batchStatus"></div>
    </section>
  </main>

  <div class="modal hidden" id="modal">
    <div class="modal-box">
      <button class="modal-close" id="modalClose">✕</button>
      <video id="preview" controls playsinline></video>
      <a class="btn primary block" id="downloadBtn" download>Download clip</a>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
